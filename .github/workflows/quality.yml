name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Enable pinned pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Baseline secret scan
        shell: pwsh
        run: |
          $matches = git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,})' -- ':!pnpm-lock.yaml'
          if ($LASTEXITCODE -eq 0) { Write-Error "Potential secret detected:`n$matches" }
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
      - name: Run shared local gate
        run: cargo xtask check
      - name: Audit frontend dependencies
        run: pnpm audit --prod --audit-level high

  dependency-policy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check Rust dependency policy
        run: cargo deny check
