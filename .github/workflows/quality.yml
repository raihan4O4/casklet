name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-quality:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Verify documented bootstrap on fresh Windows runner
        shell: pwsh
        run: ./scripts/bootstrap.ps1
      - name: Baseline secret scan
        shell: pwsh
        run: |
          $matches = git grep -n -I -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,})' -- ':!pnpm-lock.yaml'
          $grepExitCode = $LASTEXITCODE
          if ($grepExitCode -eq 0) { Write-Error "Potential secret detected:`n$matches"; exit 1 }
          if ($grepExitCode -gt 1) { exit $grepExitCode }
          exit 0
      - name: Run shared local gate
        run: cargo xtask check
      - name: Audit frontend dependencies
        run: corepack pnpm audit --prod --audit-level high

  dependency-policy:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check Rust dependency policy
        run: cargo deny check
