[workspace]
resolver = "3"
members = [
  "crates/casklet-domain",
  "crates/casklet-contracts",
  "crates/casklet-application",
  "crates/casklet-infrastructure",
  "crates/casklet-cli",
  "apps/desktop/src-tauri",
  "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
