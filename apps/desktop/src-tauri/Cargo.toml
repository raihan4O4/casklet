[package]
name = "casklet-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "casklet_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Explicit opt-in for user-authorized Alpha file cleanup; does not enable WinGet uninstall.
alpha-cleanup = []
reviewed-removal = ["casklet-application/reviewed-removal", "casklet-infrastructure/reviewed-removal"]

[build-dependencies]
cc = "=1.4.7"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
casklet-application = { path = "../../../crates/casklet-application", version = "=0.1.0-alpha.1" }
casklet-contracts = { path = "../../../crates/casklet-contracts", version = "0.1.0-alpha.1" }
casklet-infrastructure = { path = "../../../crates/casklet-infrastructure", version = "=0.1.0-alpha.1" }
tauri = { version = "=2.11.1", features = [] }
tauri-plugin-dialog = "=2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-single-instance = "=2.4.0"
tauri-plugin-notification = "=2.3.3"

[lints]
workspace = true
