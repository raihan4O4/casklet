[package]
name = "casklet-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "casklet_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
reviewed-removal = ["casklet-application/reviewed-removal", "casklet-infrastructure/reviewed-removal"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
casklet-application = { path = "../../../crates/casklet-application", version = "=0.0.0" }
casklet-contracts = { path = "../../../crates/casklet-contracts", version = "0.0.0" }
casklet-infrastructure = { path = "../../../crates/casklet-infrastructure", version = "=0.0.0" }
tauri = { version = "=2.11.1", features = [] }
tauri-plugin-dialog = "=2.6.0"
serde_json = "1.0.151"

[lints]
workspace = true
