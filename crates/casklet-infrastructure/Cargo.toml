[package]
name = "casklet-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
reviewed-removal = ["casklet-application/reviewed-removal"]

[dependencies]
casklet-application = { path = "../casklet-application", version = "=0.1.0-alpha.1" }
casklet-contracts = { path = "../casklet-contracts", version = "=0.1.0-alpha.1" }
casklet-domain = { path = "../casklet-domain", version = "=0.1.0-alpha.1" }
uuid = { version = "1.26.1", features = ["v4", "v5"] }
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde_json = "1.0.151"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
same-file = "1.0.6"
winapi-util = "0.1.11"
trash = "=5.2.9"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"

[lints]
workspace = true
